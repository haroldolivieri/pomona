name: CI & Deployment Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  version-gate:
    name: Version Bump Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (PR head)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Require the version bump in the submitted commit so checks remain attached
      # to the actual PR head. CI must not push an unchecked replacement commit.
      - name: Compute version bump
        id: bump
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            git fetch origin main --no-tags 2>/dev/null || true
          fi
          node scripts/version-bump.mjs --base "$BASE_REF"

      - name: Require committed version bump
        run: |
          if ! git diff --quiet -- apps/web/package.json; then
            echo "::error::Sources changed without a version bump. Run node scripts/version-bump.mjs --base '$BASE_REF', commit apps/web/package.json, and push again."
            exit 1
          fi
          echo "Version gate passed"
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}

  check-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      prompts_changed: ${{ steps.filter.outputs.prompts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            prompts:
              - 'apps/proxy/src/**'
              - 'apps/web/src/**'
              - 'packages/contract/src/**'
              - 'packages/evals/**'
            eval_coverage:
              - 'packages/evals/dataset/ground-truth.json'
              - 'packages/evals/assertions/**'
              - 'packages/evals/test/**'

      - name: Require eval coverage for behavior changes
        if: steps.filter.outputs.prompts == 'true' && steps.filter.outputs.eval_coverage != 'true'
        run: |
          echo "::error::Behavior changes require an eval scenario, assertion, or regression test in packages/evals."
          exit 1

  unit-tests:
    name: Typecheck & Unit Tests (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: |
          pnpm --filter @pomona/contract build || true
          pnpm --filter @pomona/proxy build || true

      - name: Copy extraction and translation completeness
        run: pnpm lint:copy

      - name: Typecheck
        run: pnpm typecheck

      - name: Version hook regression tests
        run: node --test scripts/version-hook.test.mjs

      - name: Unit tests (web, proxy, contract, evals)
        run: pnpm -r test

  eval-gate:
    name: Prompt Regression & Live Eval Gate (main merge only)
    needs: check-changes
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-changes.outputs.prompts_changed == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: |
          pnpm --filter @pomona/contract build || true
          pnpm --filter @pomona/proxy build || true

      - name: Run Deterministic Unit Evals
        run: pnpm --filter @pomona/evals test

      - name: Run Non-blocking Live Model Benchmark (Gemini 3.1 Flash-Lite)
        continue-on-error: true
        run: pnpm --filter @pomona/evals eval:live
        env:
          CI: "true"
          EVAL_MODEL: "gemini-3.1-flash-lite"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  e2e-web:
    name: Playwright E2E (main merge only)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @pomona/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @pomona/web test:e2e

  deploy:
    name: Build & Deploy Worker + Static Assets
    needs: [version-gate, check-changes, unit-tests, eval-gate, e2e-web]
    # Deploy only on push to main (or workflow_dispatch), and ensure gates passed if they ran
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.version-gate.result == 'success' &&
      needs.check-changes.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      (needs.eval-gate.result == 'success' || needs.eval-gate.result == 'skipped') &&
      needs.e2e-web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web client & worker
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        run: |
          if [ -z "$AI_GATEWAY_ID" ]; then
            echo "Set the AI_GATEWAY_ID repository variable before deploying production."
            exit 1
          fi
          pnpm --filter @pomona/proxy exec wrangler deploy \
            --var "AI_GATEWAY_ACCOUNT_ID:$AI_GATEWAY_ACCOUNT_ID" \
            --var "AI_GATEWAY_ID:$AI_GATEWAY_ID"
        env:
          AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
          AI_GATEWAY_ACCOUNT_ID: ${{ vars.AI_GATEWAY_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '553fb87d04f36b2f088f1250f34503cc' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '553fb87d04f36b2f088f1250f34503cc' }}
