# Pomona Offline Ground-Truth & Adversarial Evaluation Suite (Promptfoo)
# Benchmarking LLM/VLM models against Pomona contract, spatial IoU ground-truth,
# polygon isolation, and domain error triggers (unclear_photo, no_produce, multiple_types).

description: "Pomona Ground-Truth & Adversarial Produce Selection Evaluation"

prompts:
  - file://prompts/system-and-user.json

providers:
  - id: "google:gemini-3.8-flash"
    config:
      temperature: 0.1
      response_format:
        type: "json_object"
  - id: "google:gemini-3.5-flash-lite"
    config:
      temperature: 0.1
      response_format:
        type: "json_object"
  - id: "google:gemini-3.1-flash-lite"
    config:
      temperature: 0.1
      response_format:
        type: "json_object"
  - id: "openai:gpt-4o-mini"
    config:
      temperature: 0.1
      response_format:
        type: "json_object"

defaultTest:
  assert:
    - type: javascript
      value: file://assertions/verify-contract.ts

tests:
  # 1. Ground-Truth Spatial Winner & Runner-Up Ranking
  - description: "01 - Watermelon Crate (Bottom-Left Ripe Winner [415,150,780,520] vs Bottom-Right Runner-Up [430,545,775,880] vs Top-Center Underripe)"
    vars:
      round: 1
      imagePath: "dataset/images/01-watermelon-crate-clear-winner.jpg"
      expectedStatus: "ok"
      expectedProduceType: "watermelon"
      produceDisplayName: "Watermelon"
      expectedCandidateCountMin: 2
      expectedCandidateCountMax: 3
      expectedWinnerBox: [415, 150, 780, 520]
      expectedRunnerUpBox: [430, 545, 775, 880]
      forbiddenWordsInCopy: ["avocado", "pineapple", "banana", "tomato", "mango"]
      imageDescription: "3 watermelons in a crate: bottom-left has large golden field spot and sugar webbing; bottom-right has small pale spot; top-center is shiny bright green with white spot."

  # 2. Adversarial Focus Polygon Isolation
  - description: "02 - Hass Avocado Polygon Isolation (Must ignore top-left ripe avocado outside polygon and pick bottom-left [495,105,915,475])"
    vars:
      round: 1
      imagePath: "dataset/images/02-avocado-polygon-isolation.jpg"
      expectedStatus: "ok"
      expectedProduceType: "avocado"
      produceDisplayName: "Hass Avocado"
      focusPolygon: [[80, 460], [950, 460], [950, 950], [80, 950]]
      expectedCandidateCountMin: 2
      expectedCandidateCountMax: 2
      expectedWinnerBox: [495, 105, 915, 475]
      expectedRunnerUpBox: [465, 550, 885, 905]
      forbiddenWordsInCopy: ["watermelon", "melon", "cantaloupe", "field spot", "rind"]
      imageDescription: "3 avocados on table: top-left outside polygon; bottom-left dark pebbled ripe inside polygon; bottom-right bright green underripe inside polygon."

  # 3. Adversarial Domain Error: Unclear / Blurry Photo
  - description: "03 - Extreme Motion Blur & Darkness -> Must return status = 'unclear_photo'"
    vars:
      round: 1
      imagePath: "dataset/images/03-unclear-blurry-photo.jpg"
      expectedStatus: "unclear_photo"
      imageDescription: "Severely out-of-focus, dark motion-blurred streak with no discernible produce traits."

  # 4. Adversarial Domain Error: Non-Produce Item
  - description: "04 - Packaged Cereal Box with Barcode -> Must return status = 'no_produce'"
    vars:
      round: 1
      imagePath: "dataset/images/04-no-produce-cereal-box.jpg"
      expectedStatus: "no_produce"
      imageDescription: "A blue cardboard box of Crunchy Oats Cereal with a UPC barcode and zero fresh produce."

  # 5. Adversarial Domain Error: Mixed Produce Types
  - description: "05 - Mixed Produce Basket (Apples, Pineapple, Bananas) -> Must return status = 'multiple_types'"
    vars:
      round: 1
      imagePath: "dataset/images/05-multiple-types-mixed.jpg"
      expectedStatus: "multiple_types"
      imageDescription: "Wicker produce display containing Honeycrisp Apples, a Golden Pineapple, and Cavendish Bananas with no focus polygon."

  # 6. Multi-Round Follow-Up Flip Overtake (State 5B-2)
  - description: "06 - Round 2 Runner-Up Watermelon Flip Overtakes 1st Pick (State 5B-2)"
    vars:
      round: 2
      imagePath: "dataset/images/06-round2-runner-up-flip-overtakes.jpg"
      expectedStatus: "ok"
      expectedProduceType: "watermelon"
      produceDisplayName: "Watermelon"
      followUpContext:
        produceType: "watermelon"
        produceDisplayName: "Watermelon"
        targetCandidateId: "c2"
        targetRole: "runner_up"
        requestedInstruction: "Flip the Runner-Up Watermelon over to inspect its underside ground spot."
        previousWinner:
          id: "c1"
          role: "first_pick"
          score: 8.6
          ripeness: "ripe"
          traits: ["Yellow field spot", "Matte rind"]
          anglesInspected: 1
        previousRunnerUp:
          id: "c2"
          role: "runner_up"
          score: 8.1
          ripeness: "almost_ripe"
          traits: ["Even shape", "Dark stripes"]
          anglesInspected: 1
      expectedWinnerBox: [120, 125, 885, 885]
      expectedWinnerId: "c2"
      expectedRunnerUpId: "c1"
      expectedFollowUpNull: false
      expectedFollowUpTargetId: "c1"
      expectedFollowUpTargetRole: "first_pick"
      requireFlipSummaryNonNull: true
      forbiddenWordsInCopy: ["avocado", "pineapple", "banana"]
      imageDescription: "Close-up of flipped watermelon #c2 showing a huge deep butter-yellow ground spot and dense pollination webbing."

  # 7. Multi-Round Follow-Up Flip Loses (State 5B-1)
  - description: "07 - Round 2 Runner-Up Watermelon Flip Loses to 1st Pick (State 5B-1)"
    vars:
      round: 2
      imagePath: "dataset/images/07-round2-runner-up-loses.jpg"
      expectedStatus: "ok"
      expectedProduceType: "watermelon"
      produceDisplayName: "Watermelon"
      followUpContext:
        produceType: "watermelon"
        produceDisplayName: "Watermelon"
        targetCandidateId: "c2"
        targetRole: "runner_up"
        requestedInstruction: "Flip the Runner-Up Watermelon over to inspect its underside ground spot."
        previousWinner:
          id: "c1"
          role: "first_pick"
          score: 8.6
          ripeness: "ripe"
          traits: ["Yellow field spot", "Matte rind"]
          anglesInspected: 1
        previousRunnerUp:
          id: "c2"
          role: "runner_up"
          score: 8.1
          ripeness: "almost_ripe"
          traits: ["Even shape", "Dark stripes"]
          anglesInspected: 1
      expectedInspectedBox: [135, 115, 705, 905]
      expectedWinnerId: "c1"
      expectedRunnerUpId: "c2"
      expectedFollowUpNull: true
      requireFlipSummaryNonNull: true
      forbiddenWordsInCopy: ["avocado", "pineapple", "banana"]
      imageDescription: "Close-up of flipped watermelon #c2 revealing a stark chalky-white underripe spot with zero sugar webbing."

  # 8. Multi-Round Round 3 Final Check — 1st Pick Reclaims Win (State 7A)
  - description: "08 - Round 3 Final Check: 1st Pick Reclaims Win (State 7A, Hard Ceiling followUp=null)"
    vars:
      round: 3
      imagePath: "dataset/images/08-round3-first-pick-reclaims.jpg"
      expectedStatus: "ok"
      expectedProduceType: "watermelon"
      produceDisplayName: "Watermelon"
      followUpContext:
        produceType: "watermelon"
        produceDisplayName: "Watermelon"
        targetCandidateId: "c1"
        targetRole: "first_pick"
        requestedInstruction: "Flip your 1st pick Watermelon over for a fair final check of its underside."
        previousWinner:
          id: "c2"
          role: "runner_up"
          score: 9.0
          ripeness: "ripe"
          traits: ["Deep creamy spot", "Sugar webbing"]
          anglesInspected: 2
        previousRunnerUp:
          id: "c1"
          role: "first_pick"
          score: 8.6
          ripeness: "ripe"
          traits: ["Yellow field spot", "Matte rind"]
          anglesInspected: 1
      expectedWinnerBox: [170, 145, 825, 845]
      expectedWinnerId: "c1"
      expectedRunnerUpId: "c2"
      expectedFollowUpNull: true
      requireFlipSummaryNonNull: true
      forbiddenWordsInCopy: ["avocado", "pineapple", "banana"]
      imageDescription: "Close-up of flipped 1st pick watermelon #c1 revealing a huge deep golden-amber spot, dense brown webbing, and dry tendril."

  # 9. Multi-Round Round 3 Final Check — 1st Pick Loses (State 7B)
  - description: "09 - Round 3 Final Check: 1st Pick Loses to Runner-Up (State 7B, Hard Ceiling followUp=null)"
    vars:
      round: 3
      imagePath: "dataset/images/09-round3-first-pick-loses.jpg"
      expectedStatus: "ok"
      expectedProduceType: "watermelon"
      produceDisplayName: "Watermelon"
      followUpContext:
        produceType: "watermelon"
        produceDisplayName: "Watermelon"
        targetCandidateId: "c1"
        targetRole: "first_pick"
        requestedInstruction: "Flip your 1st pick Watermelon over for a fair final check of its underside."
        previousWinner:
          id: "c2"
          role: "runner_up"
          score: 9.0
          ripeness: "ripe"
          traits: ["Deep creamy spot", "Sugar webbing"]
          anglesInspected: 2
        previousRunnerUp:
          id: "c1"
          role: "first_pick"
          score: 8.6
          ripeness: "ripe"
          traits: ["Yellow field spot", "Matte rind"]
          anglesInspected: 1
      expectedInspectedBox: [170, 195, 780, 805]
      expectedWinnerId: "c2"
      expectedRunnerUpId: "c1"
      expectedFollowUpNull: true
      requireFlipSummaryNonNull: true
      forbiddenWordsInCopy: ["avocado", "pineapple", "banana"]
      imageDescription: "Close-up of flipped 1st pick watermelon #c1 revealing a pale greenish-white belly with a sunken brown water-soaked bruise."

  # 10. Round 1 Single Produce Item (No Runner-Up)
  - description: "10 - Single Pineapple Solo (Round 1 Single Candidate -> runnerUpId=null, followUp=null)"
    vars:
      round: 1
      imagePath: "dataset/images/10-single-pineapple-solo.jpg"
      expectedStatus: "ok"
      expectedProduceType: "pineapple"
      produceDisplayName: "Pineapple"
      expectedCandidateCountMin: 1
      expectedCandidateCountMax: 1
      expectedWinnerBox: [70, 355, 830, 635]
      expectedRunnerUpId: null
      expectedFollowUpNull: true
      forbiddenWordsInCopy: ["watermelon", "melon", "avocado", "field spot", "rind"]
      imageDescription: "A single ripe golden-yellow pineapple standing alone on a wooden table."

  # 11. Pack / Bunch Produce Selection (Unit of Purchase)
  - description: "11 - Grape Punnet Pack Selection (Unit of purchase: 2 full punnets boxed, NOT individual loose berries)"
    vars:
      round: 1
      imagePath: "dataset/images/11-grape-punnet-pack-selection.jpg"
      expectedStatus: "ok"
      expectedProduceType: "grapes"
      produceDisplayName: "Red Seedless Grapes"
      expectedCandidateCountMin: 2
      expectedCandidateCountMax: 2
      expectedWinnerBox: [280, 80, 760, 480]
      expectedRunnerUpBox: [300, 530, 770, 920]
      forbiddenWordsInCopy: ["watermelon", "melon", "avocado", "pineapple", "field spot", "rind"]
      imageDescription: "Two clear plastic punnets of red seedless grapes on a supermarket display shelf."


